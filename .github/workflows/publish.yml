name: Publish

# Aligns with Zeocore: verify, retain distributions, OIDC publish, exact-version
# index smoke tests, then GitHub Release from RELEASE_NOTES.md.
# Required PyPI publisher: zeocreator / ducktyper-ai/dt-creator / publish.yml / environment pypi
# (TestPyPI: environment testpypi). An upload waits for approval once the environment requires a reviewer.
# Current index configuration is unverified since the repository move; see docs/release-readiness.md.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index target; production requires a matching version tag ref"
        required: true
        type: choice
        options: [testpypi, pypi, both]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: verify and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.verify.outputs.version }}
      python-floor: ${{ steps.verify.outputs.python-floor }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: verify
        uses: ./.github/actions/verify-build
        with:
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          target: ${{ inputs.target || 'pypi' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI with OIDC
    needs: build
    if: github.event_name == 'push' || inputs.target == 'pypi' || inputs.target == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/zeocreator
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          print-hash: true

  publish-testpypi:
    name: publish to TestPyPI with OIDC
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'testpypi' || inputs.target == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: testpypi
      url: https://test.pypi.org/p/zeocreator
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  smoke-test:
    name: verify the exact indexed release
    needs: [build, publish-pypi, publish-testpypi]
    if: always() && (needs.publish-pypi.result == 'success' || needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
      PYTHON_FLOOR: ${{ needs.build.outputs.python-floor }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_FLOOR }}
      - name: Wait for index propagation
        run: sleep 30
      - name: Smoke-test PyPI
        if: needs.publish-pypi.result == 'success'
        run: uv run --no-project --python "$PYTHON_FLOOR" python scripts/smoke_index_v2.py pypi "$EXPECTED_VERSION" "$PYTHON_FLOOR"
      - name: Smoke-test TestPyPI
        if: needs.publish-testpypi.result == 'success'
        run: uv run --no-project --python "$PYTHON_FLOOR" python scripts/smoke_index_v2.py testpypi "$EXPECTED_VERSION" "$PYTHON_FLOOR"

  github-release:
    name: create the GitHub Release
    needs: [build, publish-pypi, smoke-test]
    if: always() && needs.publish-pypi.result == 'success' && needs.smoke-test.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Create release with notes and the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/* > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; inspect it instead of overwriting"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "zeocreator ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
